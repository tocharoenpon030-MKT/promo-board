<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ป้ายราคาพิเศษ</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--ink:#14233b;--paper:#f6f4ee;--card:#fff;--tag:#ffc20e;--ok:#17803d;--bad:#c62828;--mut:#5d6879;--line:#e3dfd2}
*{box-sizing:border-box;margin:0}
body{font:18px/1.45 'Sarabun',sans-serif;background:var(--paper);color:var(--ink)}
header{background:var(--ink);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
.hd{max-width:1000px;margin:auto;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{font:700 22px 'Kanit',sans-serif}
.upd{font-size:13px;opacity:.75}
.data{font:700 16px 'Kanit';text-decoration:none;border:2px solid var(--tag);color:var(--tag);border-radius:8px;padding:6px 16px}
main{max-width:1000px;margin:auto;padding:14px 16px 60px}
.city{display:flex;gap:8px;margin-bottom:12px}
.cbtn{flex:1;font:700 18px 'Kanit',sans-serif;padding:14px 4px;border:3px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);cursor:pointer}
.cbtn.on{background:var(--tag);box-shadow:0 3px 0 var(--ink)}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;font:700 18px 'Kanit',sans-serif;padding:12px 8px;border:2px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink);cursor:pointer}
.tab.on{background:var(--ink);color:var(--tag)}
input[type=search]{width:100%;font:inherit;padding:13px 14px;border:2px solid var(--line);border-radius:10px;background:#fff}
input:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--tag);outline-offset:1px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.chip{white-space:nowrap;font:600 17px 'Sarabun';padding:8px 15px;border-radius:99px;border:2px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.chip.on{border-color:var(--ink);background:var(--tag);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-left:10px solid var(--tag);border-radius:6px 14px 14px 6px;padding:14px 16px}
.card.off{border-left-color:#bbb;opacity:.7}
.card.wt{border-left-color:var(--ink)}
.tg{font-size:14px;color:var(--mut);font-weight:600}
.nm{font-weight:700;font-size:19px;margin:2px 0 8px}
.pr{font:700 38px/1.1 'Kanit',sans-serif}
.pr small{font:600 16px 'Sarabun';color:var(--mut)}
.wait{font:700 30px 'Kanit';color:var(--mut)}
.sub{color:var(--mut);font-size:15px;margin-top:2px}
.row{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.b{font-size:15px;font-weight:700;border-radius:6px;padding:3px 9px;background:#eef0f4}
.b.g{background:#dff3e5;color:var(--ok)}
.b.r{background:#fbe0e0;color:var(--bad)}
.pe{margin:2px 0 6px}
.pe label{display:block;font-size:14px;color:var(--mut);font-weight:600}
.pin{width:100%;font:700 30px 'Kanit',sans-serif;padding:4px 10px;border:2px solid var(--ink);border-radius:8px;background:#fffbe8;color:var(--ink)}
.pin.sm{font-size:20px}
.warn{color:var(--bad);font-weight:700}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.trio div{background:#eef0f4;border-radius:8px;padding:6px 4px;text-align:center}
.trio small{display:block;font-size:12px;color:var(--mut)}
.trio b{font:700 17px 'Kanit',sans-serif}
.cost{margin-top:12px;padding:10px;border:2px dashed var(--ink);border-radius:8px;font-size:16px;background:#fffbe8}
.cost b{font-family:'Kanit'}
.ck{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px;border-radius:10px;background:#eef3fb;font-weight:700;cursor:pointer}
.ck input{width:24px;height:24px;accent-color:var(--ok)}
.bar{position:sticky;bottom:0;background:var(--paper);border-top:2px solid var(--line);padding:10px 0;margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar[hidden]{display:none}
.go{flex:1;min-width:200px;font:700 19px 'Kanit';padding:13px;border-radius:10px;border:none;background:var(--ok);color:#fff;cursor:pointer}
.go:disabled{background:#9aa3b0;cursor:not-allowed}
#st{width:100%;font-size:15px;font-weight:600}
#st.err{color:var(--bad)}#st.ok{color:var(--ok)}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:99;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
#shot{background:#fdf8ec;border-radius:16px;padding:22px 18px}
.mh{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:14px}
.mk{width:44px;height:44px;border-radius:50%;background:#dcfce7;color:#16a34a;font-size:22px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.mt{font-weight:700;font-size:17px;color:#111}
.md{font-size:13px;color:#7a7060;margin-top:2px}
.ms{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:8px;padding:8px 12px;margin-bottom:14px;border:1px solid #e8e0cc;font-size:13px;color:#7a7060}
.ms b{font-size:15px;color:#111}
.mi{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid #e8e0cc}
.mi:last-child{border-bottom:none}
.mi i{width:22px;height:22px;border-radius:50%;background:#dcfce7;color:#16a34a;font-size:13px;font-style:normal;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mi span{font-size:12px;color:#a8a08c;min-width:44px}
.mi div{font-size:15px;color:#1a1a1a;flex:1}
.mb{display:flex;gap:8px;margin-top:14px}
#save{flex:1;background:#2563eb;color:#fff;border:none;border-radius:8px;padding:12px;font:600 16px 'Sarabun',sans-serif;cursor:pointer}
#close{width:48px;background:#fff;border:1px solid #e8e0cc;border-radius:8px;cursor:pointer;font-size:16px;color:#5c5344}
.msg{padding:30px;text-align:center;color:var(--mut)}
</style>
</head>
<body>
<header><div class="hd">
  <div><h1>ป้ายราคาพิเศษ</h1><div class="upd" id="upd">กำลังโหลด…</div></div>
  <a class="data" href="https://docs.google.com/spreadsheets/d/1f7jIXOYD6u32tWUCbuvkRNg-Y__q3ZeHPBMvGanvZV0/edit?gid=0#gid=0" target="_blank" rel="noopener">DATA</a>
</div></header>
<main>
  <div class="city"><button class="cbtn on" data-c="bkk">คลังกรุงเทพ</button><button class="cbtn" data-c="ptt">คลังพัทยา</button><button class="cbtn" data-c="uc">ทีม UC</button></div>
  <div class="tabs">
    <button class="tab on" id="t-ok" data-t="ok"></button>
    <button class="tab" id="t-wait" data-t="wait"></button>
  </div>
  <input type="search" id="q" placeholder="ค้นหาสินค้า เช่น เหล็ก, ปูน, หิน">
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
  <div class="bar" id="bar" hidden>
    <button class="chip" id="all">เลือกทั้งหมด</button>
    <span id="cnt">เลือกแล้ว 0 รายการ</span>
    <button class="go" id="go">✔ อนุมัติรายการที่เลือก</button>
    <div id="st"></div>
  </div>
</main>
<div id="modal"><div style="width:100%;max-width:400px;margin:auto">
  <div id="shot">
    <div class="mh"><div class="mk">✓</div><div class="mt">อนุมัติโปรโมชั่นสำเร็จ</div><div class="md" id="mdt"></div></div>
    <div class="ms"><span id="mc"></span><b id="mn"></b></div>
    <div id="dl"></div>
  </div>
  <div class="mb"><button id="save">⬇ บันทึกเป็นรูปภาพ</button><button id="close">✕</button></div>
</div></div>
<script>
// ▼ วาง URL ของ Apps Script Web App (ลงท้าย /exec) ตัวใหม่ที่ผูกกับชีตโปร ▼
const API = 'https://script.google.com/macros/s/AKfycbwn-0Op-2BjffgJguM-b7AZpDNOp7Gm8qPY1zXGcwJtnjlxYSvuMfxPoHYxYEA4Hiql9A/exec';
const CLIENT_ID = '909287669276-e9ra107720vef8hkirhod1el8j8aalt5.apps.googleusercontent.com';  // ตัวเดิม
const SHEET_ID = '1f7jIXOYD6u32tWUCbuvkRNg-Y__q3ZeHPBMvGanvZV0';
const CITY = {bkk: 'คลังกรุงเทพ', ptt: 'คลังพัทยา', uc: 'ทีม UC'};
const hashCity = () => CITY[location.hash.slice(1)] ? location.hash.slice(1) : 'bkk';   // ชื่อแท็บในชีตตั้งที่ Code.gs
const OK_COL = 'V';       // คอลัมน์อนุมัติ
const PRICE_COLS = ['W', 'X'];   // W = ราคาที่อนุมัติ NV, X = ราคาที่อนุมัติ V
const SHEETS = 'https://sheets.googleapis.com/v4/spreadsheets/' + SHEET_ID;

let city = hashCity(), sheet = '';
let items = [], nameCol = 'D', tab = 'ok', promo = 'ทั้งหมด', q = '', view = [];
let accessToken = '', tc = null;
const sel = new Set(), edits = new Map();   // edits: row -> {nv, v} ราคาที่นายพิมพ์ปรับ
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isNum = v => typeof v === 'number' && isFinite(v);
const fmt = v => v.toLocaleString('th-TH', {maximumFractionDigits: 2});
const MON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const st = (t, c) => { $('st').textContent = t || ''; $('st').className = c || ''; };

function dateInfo(v) {
  if (!v) return null;
  let str = String(v);
  const iso = /^\d{4}-\d{2}-\d{2}T/.test(str);
  if (iso) {                                   // ISO ดิบจากชีต (UTC) -> แปลงเป็นวันที่เวลาไทย
    const d = new Date(new Date(str).getTime() + 7 * 3600 * 1000);
    str = d.toISOString().slice(0, 10);
  }
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str);
  if (!m) return {text: str, expired: false};
  const y = +m[1], be = y > 2400 ? y : y + 543, ce = be - 543;   // ปี > 2400 ถือว่าเป็น พ.ศ. อยู่แล้ว
  const d = new Date(ce, +m[2] - 1, +m[3], 23, 59, 59);
  return {text: `${+m[3]} ${MON[+m[2] - 1]} ${be}`, expired: d < new Date()};
}

async function load() {
  const c = city, ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 25000);
  try {
    const d = await (await fetch(API + '?city=' + c, {signal: ctl.signal})).json();
    if (c !== city) return;
    if (!d.ok) throw new Error(d.err);
    items = d.items; nameCol = d.nameCol || 'D'; sheet = d.sheet;
    $('upd').textContent = 'อัปเดตล่าสุด ' + new Date(d.updated).toLocaleTimeString('th-TH', {hour: '2-digit', minute: '2-digit'}) + ' น.';
    render();
  } catch (e) {
    if (c !== city) return;
    $('grid').innerHTML = `<div class="msg">โหลดข้อมูลไม่ได้ ${esc(e.name === 'AbortError' ? '(ช้าเกิน 25 วินาที)' : (e.message || ''))}<br>ตรวจสอบอินเทอร์เน็ตหรือชื่อแท็บในชีต แล้วรีเฟรชหน้านี้</div>`;
  } finally { clearTimeout(to); }
}

function switchCity(c) {
  city = c; sel.clear(); edits.clear(); items = []; promo = 'ทั้งหมด'; q = ''; $('q').value = ''; st('');
  $('grid').innerHTML = '<div class="msg">กำลังโหลด…</div>'; $('chips').innerHTML = '';
  $('bar').hidden = true;
  document.querySelectorAll('.cbtn').forEach(b => b.classList.toggle('on', b.dataset.c === c));
  load();
}

function render() {
  const ok = items.filter(i => i.approved), wt = items.filter(i => !i.approved);
  $('t-ok').textContent = `โปรผ่านการพิจารณา (${ok.length})`;
  $('t-wait').textContent = `โปรรอพิจารณา (${wt.length})`;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  const pool = tab === 'ok' ? ok : wt;
  const names = ['ทั้งหมด', ...new Set(pool.map(i => i.promo).filter(Boolean))];
  if (!names.includes(promo)) promo = 'ทั้งหมด';
  $('chips').innerHTML = names.map(n => `<button class="chip ${n === promo ? 'on' : ''}" data-p="${esc(n)}">${esc(n)}</button>`).join('');
  const k = q.trim().toLowerCase();
  view = pool.filter(i => (promo === 'ทั้งหมด' || i.promo === promo) && (!k || [i.name, i.group, i.promo].join(' ').toLowerCase().includes(k)));
  $('grid').innerHTML = view.length ? view.map(card).join('') : '<div class="msg">ไม่พบสินค้าในหมวดนี้</div>';
  $('bar').hidden = tab !== 'wait' || !wt.length;
  count();
}

function count() {
  const n = items.filter(i => !i.approved && sel.has(i.row)).length;
  $('cnt').textContent = `เลือกแล้ว ${n} รายการ`;
}

const r2 = x => Math.round(x * 100) / 100;
// ราคาที่ใช้แสดง: ที่นายพิมพ์อยู่ > ราคาที่อนุมัติ (W,X) > ราคาเดิมในชีต (P,Q)
const eff = i => edits.get(i.row) || {nv: isNum(i.apprNV) ? i.apprNV : i.priceNoVat, v: isNum(i.apprV) ? i.apprV : i.priceVat};
function calc(i, p) {
  const ok = isNum(i.qty) && i.qty > 0 && isNum(p.v);
  const totV = ok ? r2(p.v * i.qty) : null, totNV = ok && isNum(p.nv) ? r2(p.nv * i.qty) : null;
  const profit = totV !== null && isNum(i.costTotal) ? r2(totV - i.costTotal) : null;
  return {totV, totNV, profit, pct: profit !== null && i.costTotal ? profit / i.costTotal : null};
}
const totHtml = c => c.totV === null ? '' : `ยอดทั้งเที่ยว ${fmt(c.totV)} บาท (รวม VAT)` + (c.totNV !== null ? ` · ก่อน VAT ${fmt(c.totNV)} บาท` : '');
const costHtml = (i, c) => (isNum(i.costUnit) || c.profit !== null)
  ? `<div class="cost">ต้นทุน <b>${isNum(i.costUnit) ? fmt(i.costUnit) : '-'}</b>/${esc(i.unit)}
      · กำไร <b>${c.pct !== null ? fmt(c.pct * 100) + '%' : '-'}</b>
      · ทั้งเที่ยว <b>${c.profit !== null ? fmt(c.profit) : '-'}</b> บาท${c.profit !== null && c.profit < 0 ? ' <span class="warn">⚠ ขาดทุน</span>' : ''}</div>` : '';
const pin = (i, k, v, cls) => `<input class="pin ${cls || ''}" type="number" step="0.01" min="0" inputmode="decimal" placeholder="ใส่ราคา" data-r="${i.row}" data-k="${k}" value="${isNum(v) ? v : ''}">`;

function card(i) {
  const dt = dateInfo(i.validUntil), off = i.approved && dt && dt.expired, p = eff(i), c = calc(i, p);
  const box = (l, v) => `<div><small>${l}</small><b>${isNum(v) ? fmt(v) : (v ? esc(v) : '-')}</b></div>`;
  let h = `<div class="card ${off ? 'off' : ''} ${i.approved ? '' : 'wt'}">`;
  if (!i.approved) h += '<div class="row" style="margin:0 0 6px"><span class="b">⏳ รอนายติ๊กพิจารณา</span></div>';
  h += `<div class="tg">${esc(i.promo)} · ${esc(i.group)}</div><div class="nm">${esc(i.name)}</div>`;
  if (!i.approved) {
    h += `<div class="pe"><label>ราคา รวม VAT (บาท/${esc(i.unit)}) · พิมพ์ปรับได้</label>${pin(i, 'v', p.v)}</div>
      <div class="pe"><label>ก่อน VAT</label>${pin(i, 'nv', p.nv, 'sm')}</div>`;
  } else if (isNum(p.v)) {
    h += `<div class="pr">${fmt(p.v)} <small>บาท/${esc(i.unit)} (รวม VAT)</small></div>
      ${isNum(p.nv) ? `<div class="sub">ก่อน VAT ${fmt(p.nv)} บาท</div>` : ''}`;
  } else h += '<div class="wait">รอราคา</div>';
  h += `<div class="sub" id="tt-${i.row}">${totHtml(c)}</div><div class="row">`;
  if (isNum(i.qty)) h += `<span class="b">ราคานี้เมื่อสั่ง ${fmt(i.qty)} ${esc(i.unit)}</span>`;
  if (i.delivery) h += `<span class="b">🚚 ${esc(i.delivery)}</span>`;
  if (dt) h += `<span class="b ${dt.expired ? 'r' : 'g'}">${dt.expired ? 'หมดโปรแล้ว ' : 'โปรถึง '}${esc(dt.text)}</span>`;
  h += '</div>';
  h += `<div class="trio">${box('คู่แข่ง', i.competitor)}${box('ตลาด', i.market)}${box('ราคาจัดซื้อ', i.buyPrice)}</div>`;
  h += `<div id="cs-${i.row}">${costHtml(i, c)}</div>`;
  if (i.note) h += `<div class="sub">📝 ${esc(i.note)}</div>`;
  if (!i.approved) h += `<label class="ck"><input type="checkbox" class="pck" data-r="${i.row}" ${sel.has(i.row) ? 'checked' : ''}> ติ๊กเพื่ออนุมัติ</label>`;
  return h + '</div>';
}

function onPin(el) {                       // พิมพ์ช่องใดช่องหนึ่ง อีกช่องและยอดต่างๆ คำนวณตาม
  const r = +el.dataset.r, i = items.find(x => x.row === r), card = el.closest('.card');
  const other = card.querySelector('.pin[data-k="' + (el.dataset.k === 'v' ? 'nv' : 'v') + '"]');
  const val = parseFloat(el.value);
  let p;
  if (!isFinite(val) || val <= 0) { p = {nv: NaN, v: NaN}; other.value = ''; }
  else if (el.dataset.k === 'v') { p = {v: r2(val), nv: r2(val / 1.07)}; other.value = p.nv; }
  else { p = {nv: r2(val), v: r2(val * 1.07)}; other.value = p.v; }
  edits.set(r, p);
  const c = calc(i, p);
  $('tt-' + r).innerHTML = totHtml(c);
  $('cs-' + r).innerHTML = costHtml(i, c);
}

// ── Google Sign-In (OAuth token เดียวกับแดชบอร์ดอนุมัติปรับราคา) ──
function signIn(then) {
  if (!window.google || !google.accounts || !google.accounts.oauth2) return st('ระบบล็อกอิน Google ยังโหลดไม่เสร็จ ลองใหม่อีกครั้ง', 'err');
  if (accessToken) return then();
  if (!tc) tc = google.accounts.oauth2.initTokenClient({client_id: CLIENT_ID, scope: 'https://www.googleapis.com/auth/spreadsheets', callback: () => {}});
  tc.callback = r => {
    if (r.error) return st('เข้าสู่ระบบ Google ไม่สำเร็จ: ' + r.error, 'err');
    accessToken = r.access_token; then();
  };
  tc.requestAccessToken({prompt: ''});
}

async function gapi(url, opt) {
  const r = await fetch(url, Object.assign({}, opt, {headers: {'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json'}}));
  const j = await r.json();
  if (r.status === 401) { accessToken = ''; throw {auth: true}; }
  if (!r.ok) throw new Error(j.error && j.error.message ? j.error.message : 'ผิดพลาด');
  return j;
}

async function approve() {
  const rows = items.filter(i => !i.approved && sel.has(i.row));
  if (!rows.length) return st('กรุณาติ๊กเลือกอย่างน้อย 1 รายการก่อนอนุมัติ', 'err');
  const bad = rows.filter(i => { const p = eff(i); return !(isNum(p.nv) && p.nv > 0 && isNum(p.v) && p.v > 0); });
  if (bad.length) return st('กรุณาใส่ราคาก่อนอนุมัติ: ' + bad.slice(0, 3).map(i => i.name).join(', ') + (bad.length > 3 ? ' ...' : ''), 'err');
  const loss = rows.filter(i => { const c = calc(i, eff(i)); return c.profit !== null && c.profit < 0; });
  if (loss.length && !confirm(`มี ${loss.length} รายการที่ราคาต่ำกว่าต้นทุน (ขาดทุน) ยืนยันอนุมัติต่อไหม?`)) return;
  if (!accessToken) return signIn(approve);
  $('go').disabled = true; st(`กำลังบันทึก ${rows.length} รายการ…`);
  try {
    const t = "'" + sheet.replace(/'/g, "''") + "'";
    // เช็กชื่อสินค้าในแถวก่อนเขียน กันกรณีมีคนแทรก/ลบแถว
    const chk = await gapi(SHEETS + '/values:batchGet?' + rows.map(i => 'ranges=' + encodeURIComponent(`${t}!${nameCol}${i.row}`)).join('&'));
    const badRow = chk.valueRanges.some((v, k) => String(v.values && v.values[0] ? v.values[0][0] : '').trim() !== String(rows[k].name).trim());
    if (badRow) { await load(); throw new Error('ข้อมูลในชีตเปลี่ยนไป โหลดใหม่ให้แล้ว กรุณาติ๊กและกดอนุมัติอีกครั้ง'); }
    const data = [];
    rows.forEach(i => {
      const p = eff(i);
      data.push({range: `${t}!${PRICE_COLS[0]}${i.row}:${PRICE_COLS[1]}${i.row}`, values: [[p.nv, p.v]]});   // W, X
      data.push({range: `${t}!${OK_COL}${i.row}`, values: [[1]]});                                           // V = 1
    });
    await gapi(SHEETS + '/values:batchUpdate', {method: 'POST', body: JSON.stringify({valueInputOption: 'USER_ENTERED', data})});
    const now = new Date(), tz = {timeZone: 'Asia/Bangkok'};
    $('mdt').textContent = now.toLocaleDateString('th-TH', Object.assign({day: 'numeric', month: 'long', year: 'numeric'}, tz)) + ' · ' + now.toLocaleTimeString('th-TH', Object.assign({hour: '2-digit', minute: '2-digit'}, tz)) + ' น.';
    $('mn').textContent = rows.length + ' รายการ';
    $('mc').textContent = CITY[city] + ' · อนุมัติทั้งหมด';
    $('dl').innerHTML = rows.map(i => `<div class="mi"><i>✓</i><span>${esc(i.code || '')}</span><div>${esc(i.name)}</div><b style="font-size:14px;white-space:nowrap">${fmt(eff(i).v)}</b></div>`).join('');
    rows.forEach(i => { sel.delete(i.row); edits.delete(i.row); }); st('');
    $('modal').style.display = 'flex';
    await load();
  } catch (e) {
    if (e.auth) { st('หมดเวลาล็อกอิน กำลังขอเข้าสู่ระบบใหม่…'); signIn(approve); }
    else st('เกิดข้อผิดพลาด: ' + (e.message || e) + ' (ถ้าขึ้นว่าไม่มีสิทธิ์ แปลว่าบัญชีนี้ไม่ได้เป็น Editor ของชีต)', 'err');
  } finally { $('go').disabled = false; }
}

document.querySelector('.tabs').onclick = e => { if (e.target.dataset.t) { tab = e.target.dataset.t; promo = 'ทั้งหมด'; st(''); render(); } };
$('chips').onclick = e => { if (e.target.dataset.p) { promo = e.target.dataset.p; render(); } };
$('grid').oninput = e => { if (e.target.classList.contains('pin')) onPin(e.target); };
$('grid').onchange = e => { if (e.target.classList.contains('pck')) { const r = +e.target.dataset.r; e.target.checked ? sel.add(r) : sel.delete(r); count(); } };
$('all').onclick = () => {
  const all = view.length && view.every(i => sel.has(i.row));
  view.forEach(i => all ? sel.delete(i.row) : sel.add(i.row));
  render();
};
$('go').onclick = approve;
document.querySelector('.city').onclick = e => { if (e.target.dataset.c) location.hash = e.target.dataset.c; };
window.onhashchange = () => { const c = hashCity(); if (c !== city) switchCity(c); };
document.querySelectorAll('.cbtn').forEach(b => b.classList.toggle('on', b.dataset.c === city));
$('q').oninput = e => { q = e.target.value; render(); };
$('close').onclick = () => { $('modal').style.display = 'none'; };
$('save').onclick = async () => {
  const b = $('save'), t = b.textContent;
  b.textContent = '⏳ กำลังบันทึก...'; b.disabled = true;
  try {
    const c = await html2canvas($('shot'), {backgroundColor: '#fdf8ec', scale: 2, useCORS: true});
    const a = document.createElement('a');
    a.download = 'อนุมัติโปร' + CITY[city] + '-' + new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19) + '.png';
    a.href = c.toDataURL('image/png'); a.click();
  } catch (e) { alert('บันทึกรูปภาพไม่สำเร็จ: ' + e.message); }
  finally { b.textContent = t; b.disabled = false; }
};
// รีเฟรชอัตโนมัติ แต่ไม่รีเฟรชตอนนายกำลังพิมพ์ราคา (กันช่องหลุดโฟกัส)
const auto = () => { const a = document.activeElement; if (a && a.classList && a.classList.contains('pin')) return; load(); };
document.addEventListener('visibilitychange', () => { if (!document.hidden) auto(); });
setInterval(auto, 60000);
load();
</script>
</body>
</html>
